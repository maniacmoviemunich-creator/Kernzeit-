<title>Kernzeit</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#0a0a0b;--mute:#6c6c72;--line:#e6e6e8;--ac:#1f4dff;--r:10px}
:root[data-t=d]{--bg:#0b0b0c;--card:#131315;--ink:#f4f4f5;--mute:#8e8e95;--line:#26262a;--ac:#4a76ff}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#0b0b0c;--card:#131315;--ink:#f4f4f5;--mute:#8e8e95;--line:#26262a;--ac:#4a76ff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .3s,color .3s}
main{max-width:520px;margin:0 auto;padding:20px 24px 90px}
.ic{display:block;flex:none}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
.hd b{font-weight:600;letter-spacing:-.01em}
.hd b{display:flex;align-items:center;gap:10px}.hd img{border-radius:7px}
h1{font-size:1.9rem;line-height:1.2;font-weight:600;letter-spacing:-.03em;margin:0}
h2{font-size:1rem;font-weight:600;margin:64px 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.streak{text-align:center}
.streak b{display:flex;align-items:center;gap:4px;font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.streak b .ic{color:var(--ac)}
.xp{margin-top:32px;font-size:.9rem;color:var(--mute)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .5s ease}
.card{border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-top:16px;background:var(--card);transition:border-color .3s}
.due{border-color:var(--ac)}
.slot{display:flex;gap:16px;align-items:center}
.ico{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);flex:none}
.slot h3{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.slot p{margin:2px 0 0;color:var(--mute);font-size:.88rem}
button{font:inherit;font-weight:500;border:1px solid var(--ac);border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--ac);color:#fff;min-height:44px;transition:opacity .2s,transform .1s}
button:hover{opacity:.88}button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.sq{padding:0;width:44px;display:grid;place-items:center}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.done{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-weight:500}
select,input[type=number],input[type=time],input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
input[type=number]{width:80px}input[type=time]{width:auto}
.week{display:flex;justify-content:space-between}
.week>div{text-align:center;font-size:.8rem;color:var(--mute)}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);margin:8px auto 0;transition:background .3s}
.dot.h{background:linear-gradient(90deg,var(--ac) 50%,transparent 50%);border-color:var(--ac)}
.dot.f{background:var(--ac);border-color:var(--ac)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.b{text-align:center;font-size:.75rem;padding:16px 4px;border-radius:var(--r);border:1px solid var(--line);color:var(--mute)}
.b span{display:block;margin-bottom:8px;opacity:.3}.b span svg{margin:auto}
.b.on{color:var(--ink)}.b.on span{opacity:1;color:var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}
small{color:var(--mute)}
#pl{position:fixed;inset:0;background:#0a0a0b;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;z-index:9}
#cm{position:fixed;inset:0;background:#0a0a0b;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;z-index:9}
#pl.on{display:flex;animation:f .3s}
#cm.on{display:flex;animation:f .3s}
@keyframes f{from{opacity:0}}
#pl .big{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin:12px 0}
#cm .big{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin:12px 0}
#pl .t{font-size:4.5rem;font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:8px 0}
#cm .t{font-size:6rem;font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:8px 0}
#pl p{max-width:420px;color:#c9c9cf}
#cm p{max-width:420px;color:#c9c9cf}
#pl .bar{width:min(420px,90%);background:#2a2a2e}#pl .bar i{background:#6f93ff}
#cm .bar{width:min(420px,90%);background:#2a2a2e}#cm .bar i{background:#6f93ff}
#pl button{background:#ffffff1a;border-color:transparent;color:#fff}
#cm button{background:#ffffff1a;border-color:transparent;color:#fff}
.pulse{width:72px;height:72px;border-radius:50%;background:#3d6bff;animation:p 10s ease-in-out infinite;opacity:.8}
@keyframes p{50%{transform:scale(1.5)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=checkbox]{accent-color:var(--ac);width:20px;height:20px;margin:0;flex:none}
.note{font-size:.8rem;color:var(--mute);margin-top:64px}
#cm{justify-content:flex-start;overflow-y:auto}.cd{text-decoration:line-through;opacity:.5}.tmr{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#ffffff14;border-radius:14px;padding:8px 8px 8px 16px;margin:6px 0;width:min(420px,100%)}.tmr.fin{background:#3d6bff;animation:p 1s ease-in-out infinite}.tmr button{padding:4px 12px}.cap{color:#fff;font-weight:600;font-size:1.05rem;margin:4px 0 8px;min-height:1.4em}</style>

figSegs(g,M,id).forEach((d,i)=>$("g"+(i===5?6:i)).setAttribute("d",d));$("g5").setAttribute("cx",H[0]);$("g5").setAttribute("cy",H[1]);
figRaf=requestAnimationFrame(fr)};figRaf=requestAnimationFrame(fr)}

/* Kochmodus: Zutaten abhaken, Schritt für Schritt, Timer */
let CK=null,CT=[],cInt,wl;
const stepTimes=s=>{const o=[],re=/(\d+)(?:\s*(?:bis|–|-)\s*(\d+))?\s*(Minuten|Minute|Sekunden)/g;let m;while(m=re.exec(s)){const n=+(m[2]||m[1]),sk=m[3]==="Sekunden";o.push([n*(sk?1:60),n+(sk?" Sek.":" Min.")])}return o},
ingL=(r,x)=>{const k=r.t+"|"+x.n,on=(st.ck||{})[k];return`<label style="justify-content:flex-start;gap:12px;margin:9px 0;${x.c==="s"?"opacity:.65":""}"><input type="checkbox" data-k="${k}" ${on?"checked":""} onchange="ckTog(this)"><span class="${on?"cd":""}">${fq(x.q,x.u)} ${x.n}</span></label>`};
function ckTog(el){st.ck=st.ck||{};if(el.checked)st.ck[el.dataset.k]=1;else delete st.ck[el.dataset.k];save();const y=scrollY;render();scrollTo(0,y)}
function ckReset(){const t=WEEKS[wkIx()][vd].t+"|";for(const k in st.ck||{})if(k.startsWith(t))delete st.ck[k];save();render()}
function cookStart(){CK={r:WEEKS[wkIx()][vd],i:0};$("cm").classList.add("on");if(navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>wl=l).catch(()=>{});cdraw()}
function cgo(d){CK.i=Math.max(0,CK.i+d);if(CK.i>CK.r.s.length)return cdone();cdraw()}
function cdone(x){if(x){cook()}$("cm").classList.remove("on");CK=null;CT=[];clearInterval(cInt);cInt=0;if(wl){wl.release();wl=null}}
function tAdd(sec,l,i){CT.push({end:Date.now()+sec*1000,l,i,fin:0});if(!cInt)cInt=setInterval(ctick,500);ctick()}
function tDel(k){CT.splice(k,1);ctick()}
function ctick(){const now=Date.now();CT.forEach(t=>{if(!t.fin&&now>=t.end){t.fin=1;beep();navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}});
const el=$("tms");if(!el)return;el.innerHTML=CT.map((t,k)=>{const s=Math.max(0,Math.ceil((t.end-now)/1000));return`<div class="tmr ${t.fin?"fin":""}"><span>Schritt ${t.i}: ${t.l}</span><b>${t.fin?"Fertig!":Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}</b><button onclick="tDel(${k})" aria-label="Timer entfernen">×</button></div>`}).join("")}
function cdraw(){const r=CK.r,n=r.s.length,i=CK.i,isT=wo===0&&vd===todayIx()&&!dd().c;let b;
if(i===0)b=`<div class="big">Zutaten bereitlegen</div><small style="color:#fff9">${r.t}</small><div style="text-align:left;width:min(420px,100%);margin-top:12px">${parse(r).map(x=>ingL(r,x)).join("")}</div>`;
else{const s=r.s[i-1];b=`<small style="color:#fff9">${r.t}</small><div class="big">Schritt ${i} von ${n}</div><p style="font-size:1.2rem;color:#fff;line-height:1.5">${s}</p><div class="row" style="justify-content:center">${stepTimes(s).map(([sec,l])=>`<button style="background:#3d6bff" onclick="tAdd(${sec},'${l}',${i})">Timer ${l}${s.includes("pro Seite")?" (pro Seite)":""}</button>`).join("")}</div>`}
$("cm").innerHTML=`<div style="margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center">${b}<div id="tms"></div><div class="bar" style="margin:18px 0"><i style="width:${100*i/n}%"></i></div><div class="row" style="justify-content:center">${i?`<button onclick="cgo(-1)">Zurück</button>`:""}${i<n?`<button style="background:#3d6bff" onclick="cgo(1)">${i?"Weiter":"Los geht's"}</button>`:`${isT?`<button style="background:#3d6bff" onclick="cdone(1)">Gekocht (+20 XP)</button>`:`<button style="background:#3d6bff" onclick="cdone()">Fertig, guten Appetit</button>`}`}<button onclick="cdone()">Schließen</button></div></div>`;ctick()}

function tick(){if(P.paused)return;if(--P.left<=0)return next(1);draw(1)}
function next(d){P.i+=d;if(P.i<0)P.i=0;if(P.i>=P.l.length)return finish();P.left=P.l[P.i][1];beep();draw()}
function draw(soft){const[id,sec]=P.l[P.i],e=gx(id);
if(soft){$("tm").textContent=P.left;$("pb").style.width=(100*(sec-P.left)/sec)+"%";return}
$("pl").innerHTML=`<small style="color:#fff9">${P.k==="x"?"Scroll-Ersatz":S[P.k].name} · Übung ${P.i+1} von ${P.l.length}</small>
<div class="big">${e.n}</div>${e.p?'<div class="pulse"></div>':figSvg(id)}<div class="t" id="tm">${P.left}</div>
<div class="bar"><i id="pb" style="width:0"></i></div><p>${e.t}</p>
<div class="row"><button onclick="next(-1)">Zurück</button><button onclick="pause(this)">${P.paused?"Weiter":"Pause"}</button><button onclick="next(1)">Weiter</button><button onclick="quit()">Beenden</button></div>`;figLoop(id)}
function pause(b){P.paused=!P.paused;b.textContent=P.paused?"Fortsetzen":"Pause"}
function quit(){clearInterval(timer);figStop();P=null;$("pl").classList.remove("on");render()}
function finish(){clearInterval(timer);const b4=curStage(),k=P.k,t=day();st.done[t]=st.done[t]||{};let gain;
if(k==="x"){st.done[t].x=(st.done[t].x||0)+1;gain=10}else{st.done[t][k]=1;gain=50;delete st.until[k];if(st.done[t].m&&st.done[t].e)gain+=25}
st.xp+=gain;const s=stats(),nb=BADGES.filter(b=>b[2](s)&&!st.badges.includes(b[1]));nb.forEach(b=>st.badges.push(b[1]));const sc=drop(k);save();beep();P=null;
$("pl").innerHTML=`<div style="color:#6f93ff">${ic("check",48)}</div><div class="big">Geschafft.</div><p>+${gain} XP · Serie: ${streak()} Tage</p>${curStage()>b4?`<p>Neue Stufe: ${STG[curStage()]}. Deine Übungen werden anspruchsvoller.</p>`:""}${nb.map(b=>`<p>Neues Abzeichen: ${b[1]} (Belohnung wartet)</p>`).join("")}${sc?`<p style="color:#6f93ff">${ic("gift",28)}Geheime Überraschung freigeschaltet! Du findest sie unter Belohnungen.</p>`:""}<div class="row"><button onclick="quit()">Zurück zur Übersicht</button></div>`}

/* Ansicht */
function render(){const s=stats(),sg=curStage(),lv=Math.floor(st.xp/200),pc=(st.xp%200)/2,tit=TITLES[Math.min(lv,5)];
const op=[];st.badges.forEach(n=>{if(!st.claim["b:"+n]&&REW[n])op.push({k:"b:"+n,t:n,r:REW[n],i:(BADGES.find(b=>b[1]==n)||["gift"])[0]})});st.drops.forEach((d,i)=>{if(!d.c){const x=SEC[d.i];op.push({k:"s:"+i,t:(x.t?"Seltene Überraschung: ":"Überraschung: ")+x.n,r:[x.a,x.b],i:"gift"})}});const found=new Set(st.drops.map(d=>d.i)).size;const hr=new Date().getHours(),greet=hr<11?"Guten Morgen":hr<18?"Hallo":"Guten Abend";
let h=`<div class="hd"><b><img src="${document.querySelector('link[rel=icon]').href}" width="28" height="28" alt="">Kernzeit</b><button class="ghost sq" onclick="cycleTheme()" aria-label="Darstellung wechseln (${st.theme==="auto"?"automatisch":st.theme==="l"?"hell":"dunkel"})">${ic({auto:"half",l:"sun",d:"moon"}[st.theme]||"half",20)}</button></div><div class="top"><div><h1>${greet}.<br>Zwei kleine Pausen, ein ruhigerer Tag.</h1></div><div class="streak"><b>${ic("flame",20)}${streak()}</b><small>Tage in Folge</small></div></div>
<div class="xp">Level ${lv+1} · ${tit} · ${st.xp} XP<br>Stufe ${sg+1}: ${STG[sg]}${st.stg<0&&sg<3?` · noch ${TH[sg+1]-s.tot} Einheiten bis zur nächsten`:""}<div class="bar"><i style="width:${pc}%"></i></div></div><h2>Heute</h2>`;
for(const k of["m","e"]){const o=S[k],d=!!dd()[k],isd=due(k);
h+=`<div class="card slot-wrap ${isd?"due":""}"><div class="slot ${o.c}"><div class="ico">${ic(o.ico,22)}</div><div><h3>${o.name}</h3><p>ca. ${mins(k)} Min · Erinnerung ${fmt(target(k))}${st.until[k]?" (verschoben)":""}</p></div></div>`;
if(d)h+=`<div class="row"><span class="done">${ic("check",16)} Erledigt</span><button class="ghost" onclick="start('${k}')">Nochmal</button></div>`;
else h+=`<div class="row"><button onclick="start('${k}')">Jetzt starten</button><button class="ghost" onclick="snooze('${k}')">+${st.sn} Min</button><input type="number" min="1" max="720" placeholder="Min" id="sn${k}" aria-label="Minuten verschieben"><button class="ghost" onclick="snooze('${k}',$('sn${k}').value)">Verschieben</button></div>`;
h+=`</div>`}
h+=`<h2>Woanders trainiert?</h2><div class="card">${dd().o?`<span class="done">${ic("check",16)} ${dd().ot}, ${dd().o} Min eingetragen. Heute darfst du aussetzen, deine Serie bleibt.</span>`:`<div class="row"><select id="ot"><option>Fitnessstudio</option><option>Laufen</option><option>Radfahren</option><option>Schwimmen</option><option>Mannschaftssport</option><option>Sonstiges</option></select><input type="number" id="om" min="10" value="30" aria-label="Minuten"><button onclick="logExt()">Eintragen</button></div><small>Mindestens 10 Minuten. Zählt für die Serie, Erinnerungen pausieren heute.</small>`}</div><h2>Statt scrollen</h2><div class="card"><p style="margin:0">Statt noch ein Video: 45 Sekunden Nacken, Atem oder Kreislauf. Heute schon ${dd().x||0}x.</p><div class="row"><button onclick="start('x')">Scroll-Ersatz starten</button></div></div>${kitchen()}<h2>Diese Woche</h2><div class="card week">`;
for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const c=cnt(day(d));h+=`<div>${d.toLocaleDateString("de",{weekday:"short"}).slice(0,2)}<div class="dot ${c==2?"f":c==1?"h":""}"></div></div>`}
h+=`</div><h2>Abzeichen</h2><div class="badges">${BADGES.map(b=>`<div class="b ${st.badges.includes(b[1])?"on":""}"><span>${ic(b[0],26)}</span>${b[1]}</div>`).join("")}</div>
<h2>Belohnungen</h2>${op.length?op.map(o=>`<div class="card"><div class="slot"><div class="ico">${ic(o.i,22)}</div><h3>${o.t}</h3></div><p style="margin:20px 0 0"><b>Allein:</b> ${o.r[0]}</p><p style="margin:10px 0 0"><b>Zu zweit:</b> ${o.r[1]}</p><div class="row"><button onclick="claim('${o.k}')">Eingelöst</button></div></div>`).join(""):`<p style="color:var(--mute);margin:0">Jedes Abzeichen schaltet eine kleine Belohnung frei, die du dir gönnen darfst.</p>`}
<p style="margin:24px 0 0"><small>Geheime Überraschungen entdeckt: ${found} von ${SEC.length}. Sie tauchen unregelmäßig nach Einheiten auf.</small></p>
<h2>Einstellungen</h2><div class="card"><label>Morgens erinnern<input type="time" value="${st.times.m}" onchange="setTime('m',this.value)"></label>
<label>Abends erinnern<input type="time" value="${st.times.e}" onchange="setTime('e',this.value)"></label>
<label>Schwierigkeit<select onchange="setStg(this.value)"><option value="-1">Automatisch</option>${STG.map((n,i)=>`<option value="${i}" ${st.stg==i?"selected":""}>${n}</option>`).join("")}</select></label>
<label>Standard-Verschiebung (Min)<input type="number" min="1" value="${st.sn}" onchange="setSn(this.value);render()"></label>
<div class="row"><button class="ghost" onclick="askNotif()">${st.notif?"Benachrichtigungen aktiv":"Benachrichtigungen erlauben"}</button></div>
<small>Erinnerungen kommen, solange die App im Browser geöffnet oder als Tab im Hintergrund aktiv ist.</small></div>
<h2>Scroll-Pausen</h2><div class="card"><p style="margin:0 0 8px;color:var(--mute);font-size:.9rem">Zufällige Push-Nachrichten, die dich beim Doomscrollen fragen, ob du eine 45-Sekunden-Übung machen willst. Ein Tipp startet die Übung sofort.</p>
<label>Zufällige Scroll-Pausen<input type="checkbox" ${px().on?"checked":""} onchange="pxToggle(this.checked)"></label>
${px().on?`<label>Nachrichten pro Tag<select onchange="pxSet('n',this.value)">${[1,2,3,4,5].map(n=>`<option ${px().n===n?"selected":""}>${n}</option>`).join("")}</select></label>
<label>Frühestens<input type="time" value="${px().a}" onchange="pxSet('a',this.value)"></label><label>Spätestens<input type="time" value="${px().b}" onchange="pxSet('b',this.value)"></label>
<p style="margin:14px 0 6px"><b>Einmalig einrichten</b></p><ol style="padding-left:20px;margin:0;font-size:.9rem"><li style="margin:6px 0">Kostenlose App <b>ntfy</b> installieren (Android oder iOS).</li><li style="margin:6px 0">In ntfy auf „+“ tippen, Server <b>ntfy.sh</b>, Thema: <b>${px().topic}</b></li><li style="margin:6px 0">Hier „Test senden“ tippen.</li></ol>
<div class="row"><button class="ghost" onclick="pxTest()">Test senden</button><button class="ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText(px().topic);this.textContent='Kopiert'">Thema kopieren</button></div>
<small>Die Nachrichten werden beim Öffnen der App bis zu 2,5 Tage im Voraus eingeplant. Öffne sie daher mindestens alle 2 Tage. Beim Ausschalten kommen schon geplante Nachrichten nicht mehr an, sobald du das Thema in ntfy entfernst. Es werden nur das zufällige Thema und der Nachrichtentext an ntfy.sh gesendet.</small>`:""}</div>
<p class="note">Kein Ersatz für ärztlichen Rat. Bei Schmerzen (nicht nur Dehngefühl), Schwindel oder Brustschmerz stoppen und abklären lassen. Bei starken Nackenverspannungen helfen zusätzlich Wärme und regelmäßige Bildschirmpausen.</p>`;
const a=$("app"),y=scrollY;a.innerHTML=h;scrollTo(0,y)}
/* Scroll-Pausen per ntfy.sh: geplante Push-Nachrichten, Tipp öffnet direkt die Übung */
const PXM=["Scrollst du gerade? 45 Sekunden Pause für Nacken und Rücken: tippen und los.","Kurz den Daumen stoppen? Eine 45-Sekunden-Übung wartet auf dich.","Doomscrollen? Tausch die nächsten 45 Sekunden gegen eine Dehnung.","Dein Nacken meldet sich. Tippen für eine kurze Übung statt weiterem Feed."];
let pxBusy=0;const px=()=>st.px=Object.assign({on:0,topic:"",n:3,a:"10:00",b:"21:00",sched:[]},st.px||{}),
pxUrl=()=>location.href.split("#")[0].split("?")[0]+"#scroll",
pxSend=t=>fetch("https://ntfy.sh/"+px().topic,{method:"POST",body:PXM[Math.floor(Math.random()*PXM.length)],headers:{Title:"Kernzeit",At:String(Math.floor(t/1000)),Click:pxUrl()}}).then(r=>{if(!r.ok)throw 0;return 1});
async function pxFill(){const p=px();if(!p.on||!p.topic||pxBusy)return;pxBusy=1;try{const now=Date.now(),hz=now+60*36e5,mn=s=>{const[a,b]=s.split(":");return+a*60+ +b};p.sched=p.sched.filter(t=>t>now);
const A=mn(p.a),B=Math.max(mn(p.b),A+30);
for(let d=0;d<3;d++){const base=new Date();base.setDate(base.getDate()+d);base.setHours(0,0,0,0);const b0=base.getTime();
let have=p.sched.filter(t=>t>=b0&&t<b0+864e5).length;
for(let tries=0;have<p.n&&tries<40;tries++){const t=b0+(A+Math.random()*(B-A))*6e4;
if(t<now+12e4||t>hz||p.sched.some(x=>Math.abs(x-t)<90*6e4))continue;
try{await pxSend(t);p.sched.push(t);have++}catch(e){pxBusy=0;save();return}}}
save()}finally{pxBusy=0}}
function pxToggle(on){const p=px();p.on=on?1:0;if(on){p.topic=p.topic||"kernzeit-"+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join("");p.sched=[];save();pxFill()}else{p.topic="";p.sched=[];save()}render()}
function pxSet(k,v){px()[k]=k==="n"?+v:v;save();pxFill()}
function pxTest(){pxSend(Date.now()+12e3).then(()=>alert("Test-Nachricht ist unterwegs und kommt in ca. 15 Sekunden. Tippe sie an, dann sollte direkt eine Übung starten.")).catch(()=>alert("Senden nicht möglich. Bist du online?"))}
function deep(){if(location.hash==="#scroll"){history.replaceState(null,"",location.pathname+location.search);if(!P)start("x")}}
addEventListener("hashchange",deep);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pxFill()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyTheme();render();check();pxFill();deep();
</script>
